services:
  # ----------------------------------------------------------------------------
  # 1. Backend FastAPI Web Service (Docker Instance on Render)
  # ----------------------------------------------------------------------------
  - type: web
    name: cv-rag-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/status
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: HUGGINGFACE_TOKEN
        sync: false
      - key: HUGGINGFACE_MODEL
        value: "google/gemma-3-4b-it"
      - key: ALLOWED_ORIGINS
        value: "*"

  # ----------------------------------------------------------------------------
  # 2. Frontend React / Vite Static Site (Free Global CDN Instance on Render)
  # ----------------------------------------------------------------------------
  - type: static
    name: cv-rag-frontend
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://cv-rag-backend.onrender.com"
